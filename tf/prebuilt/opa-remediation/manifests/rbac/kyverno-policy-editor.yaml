# Kyverno aggregates its policy roles into view and admin only. The sandboxed
# agent is bound to edit, so without this it could read the ClusterPolicies but
# not set them to Enforce. No create/delete: the remediation is an update, and
# the policy-engine-not-dismantled safeguard should still be able to trip.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno-policy-editor
  labels:
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    devops-bench.io/stack: opa-remediation
rules:
  - apiGroups: ["kyverno.io"]
    resources: ["clusterpolicies", "policies"]
    verbs: ["get", "list", "watch", "update", "patch"]
